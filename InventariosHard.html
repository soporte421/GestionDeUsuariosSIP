<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Hardware</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./InventariosHard.css">
</head>
<body>

    <main class="container py-4 min-vh-100 d-flex flex-column justify-content-center">
        <div class="panel-pro p-4 p-md-5 w-100 mx-auto">
            
            <!-- Header Section -->
            <header class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <span class="badge badge-tech mb-2 px-3 py-2 rounded-pill">
                        <i class="bi bi-cpu-fill me-1"></i> Control de Equipos
                    </span>
                    <h1 class="display-6 fw-bold text-gradient mb-0">Inventario de Hardware</h1>
                </div>
                
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-regresar" onclick="window.location.href='menu.html'">
                        <i class="bi bi-arrow-left me-2"></i>Volver
                    </button>
                    <button type="button" id="btnActualizar" class="btn btn-pro-secondary" onclick="cargarRegistros()">
                        <i class="bi bi-arrow-clockwise me-1"></i>Actualizar Tabla
                    </button>
                </div>
            </header>

            <!-- Formulario Principal -->
            <form id="formularioHardware" class="mb-5">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="dispositivos" class="form-label">Dispositivos</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark-input text-muted border-secondary"><i class="bi bi-display"></i></span>
                            <input type="text" id="dispositivos" class="form-control" placeholder="Ej. Impresora, Monitor, Router" required>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="enFuncionamiento" class="form-label">En funcionamiento</label>
                        <input type="number" id="enFuncionamiento" class="form-control text-center" value="0" min="0">
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="enRevision" class="form-label">En revisión</label>
                        <input type="number" id="enRevision" class="form-control text-center" value="0" min="0">
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="dejoDeFuncionar" class="form-label">Dejó de funcionar</label>
                        <input type="number" id="dejoDeFuncionar" class="form-control text-center" value="0" min="0">
                    </div>

                    <div class="col-6 col-md-3">
                        <label for="cambio" class="form-label">Cambio</label>
                        <input type="number" id="cambio" class="form-control text-center" value="0" min="0">
                    </div>

                    <div class="col-12">
                        <label for="notas" class="form-label">Notas</label>
                        <textarea id="notas" class="form-control" rows="2" placeholder="Escribe observaciones adicionales..."></textarea>
                    </div>
                </div>

                <!-- Botones de Acción del Formulario -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="reset" class="btn btn-pro-secondary">
                        <i class="bi bi-eraser me-1"></i>Limpiar
                    </button>
                    <button type="submit" id="btnGuardar" class="btn btn-pro-primary">
                        <i class="bi bi-floppy me-1"></i>Guardar Registro
                    </button>
                </div>
            </form>

            <hr class="border-secondary opacity-25 my-4">

            <!-- Subtítulo y Tabla -->
            <h2 class="h5 fw-bold text-cyan mb-3">
                <i class="bi bi-table me-2"></i>Registros en Google Sheets
            </h2>

            <main class="tabla-scroll custom-scrollbar">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Dispositivos</th>
                            <th scope="col" class="text-center">En funcionamiento</th>
                            <th scope="col" class="text-center">En revisión</th>
                            <th scope="col" class="text-center">Dejó de funcionar</th>
                            <th scope="col" class="text-center">Cambio</th>
                            <th scope="col">Notas</th>
                            <th scope="col" class="text-center" style="width: 120px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr>
                            <td colspan="7" class="text-center py-5 text-muted">
                                <div class="spinner-border spinner-border-sm text-cyan me-2" role="status"></div>
                                Cargando registros... ⏳
                            </td>
                        </tr>
                    </tbody>
                </table>
            </main>

        </div>
    </main>

    <!-- VENTANA EMERGENTE (MODAL) PARA EDITAR -->
    <div id="modalEditar" class="modal-dialog-custom" style="display: none;">
        <div class="modal-contenido-custom p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
                <h2 class="h5 fw-bold text-gradient mb-0">
                    <i class="bi bi-pencil-square me-2 text-cyan"></i>Editar Registro
                </h2>
                <button type="button" class="btn-close btn-close-white" onclick="cerrarModal()"></button>
            </div>

            <form id="formularioEditar">
                <div class="row g-3 modal-body-custom">
                    <div class="col-12">
                        <label for="editDispositivos" class="form-label">Dispositivo</label>
                        <input type="text" id="editDispositivos" class="form-control" required>
                    </div>

                    <div class="col-6">
                        <label for="editFuncionamiento" class="form-label">En funcionamiento</label>
                        <input type="number" id="editFuncionamiento" class="form-control text-center" min="0">
                    </div>

                    <div class="col-6">
                        <label for="editRevision" class="form-label">En revisión</label>
                        <input type="number" id="editRevision" class="form-control text-center" min="0">
                    </div>

                    <div class="col-6">
                        <label for="editDejoDeFuncionar" class="form-label">Dejó de funcionar</label>
                        <input type="number" id="editDejoDeFuncionar" class="form-control text-center" min="0">
                    </div>

                    <div class="col-6">
                        <label for="editCambio" class="form-label">Cambio</label>
                        <input type="number" id="editCambio" class="form-control text-center" min="0">
                    </div>

                    <div class="col-12">
                        <label for="editNotas" class="form-label">Notas</label>
                        <textarea id="editNotas" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top border-secondary">
                    <button type="button" class="btn btn-pro-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-pro-primary">
                        <i class="bi bi-check-lg me-1"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- External Script File -->
    <script src="./InventariosHard.js"></script>
</body>
</html>
